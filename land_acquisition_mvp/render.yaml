services:
  - type: web
    name: land-acquisition-backend
    runtime: python
    rootDir: land_acquisition_mvp
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
